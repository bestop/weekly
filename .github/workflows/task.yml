name: Notion to Markdown

on:
  schedule:
    - cron: '0 0 * * 1'  #format: minute hour day month weekday
  workflow_dispatch:  # 允许手动触发
    inputs:
      start:
        description: '起始日期(含)，格式 2026-05-11，留空=最近7天（用于回补缺失的期数）'
        required: false
        type: string
      end:
        description: '结束日期(不含)，格式 2026-05-18，留空=今天'
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch-and-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @notionhq/client moment

      - name: Fetch Notion data and create Markdown files
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FETCH_START: ${{ inputs.start }}
          FETCH_END: ${{ inputs.end }}
        run: node .github/workflows/notion2md.js

      - name: Commit and push if there are changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add new posts from Notion" && git push)
